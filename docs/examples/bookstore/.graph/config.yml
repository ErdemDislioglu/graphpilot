routing:
  - when: { complexity: low, type: [scaffold, docs, config] }
    model: haiku
  - when: { complexity: low }
    model: haiku
  - when: { complexity: med }
    model: sonnet
  - when: { complexity: high }
    model: opus
  - when: { risk: high }
    model: opus
    review: false
escalation: [haiku, sonnet, opus]
max_attempts_per_model: 1
budgets:
  default_context: 8000
  max_turns: 25
