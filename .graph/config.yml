routing:
  - when: { complexity: low, type: [scaffold, docs, config] }
    model: haiku
  - when: { complexity: low }
    model: haiku
  - when: { complexity: med }
    model: sonnet
  - when: { complexity: high }
    model: opus
  - when: { risk: high }
    model: opus
    review: false
escalation: [haiku, sonnet, opus]
max_attempts_per_model: 1
budgets:
  default_context: 8000
  max_turns: 25
confirm_expand: false
parallelism: 2
# checks:
#   build: "npm run build"
#   lint: "npm run lint"
#   test: "npm test"
fix_loop:
  enabled: true
  max_rounds: 3
  acceptance_check_model: haiku
  break_if_no_progress: true
